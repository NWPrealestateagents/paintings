<!doctype html>
<html lang="en">
<head>

<style>
:root{box-sizing:border-box;--bg:#0f0e0d;--fg:#f3ede2;--muted:rgba(243,237,226,.62);--chip:rgba(15,14,13,.55);--accent:#c9a96a;--seal:#ad2f29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
.stage{position:fixed;inset:0;touch-action:manipulation}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  padding:calc(3.5vmin + env(safe-area-inset-top,0px)) 3.5vmin calc(9vmin + env(safe-area-inset-bottom,0px));
  opacity:0;transition:opacity .8s ease;pointer-events:none}
.layer.on{opacity:1}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:1px solid rgba(243,237,226,.28);
  background:var(--chip);color:var(--fg);font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 0 4px;z-index:3}
.prev{left:max(14px,env(safe-area-inset-left,0px))}.next{right:max(14px,env(safe-area-inset-right,0px))}
.nav:active{background:rgba(201,169,106,.35)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 24px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.count{font-size:17px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}.count b{color:var(--accent);font-weight:600}
.state{font-size:15px;color:var(--muted);letter-spacing:.08em;opacity:0;transition:opacity .3s}.state.show{opacity:1}
.progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;z-index:4}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;font-size:15px;color:var(--muted);letter-spacing:.06em;transition:opacity 1.2s;pointer-events:none}
.hint.gone{opacity:0}
.start{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;cursor:pointer;transition:opacity .6s}
.start.gone{opacity:0;pointer-events:none}
.start .name{display:flex;flex-direction:column;align-items:center;font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","楷体",serif;font-size:clamp(4.5rem,16vmin,9rem);line-height:1.05}
.start .seal{display:flex;flex-direction:column;align-items:center;background:var(--seal);color:#f8f0e7;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;font-size:1.7rem;line-height:1.08;padding:.45em .4em;border-radius:3px;transform:rotate(-2deg)}
.start p{margin:0;color:var(--muted);font-size:1.15rem;letter-spacing:.08em}
.nosleep{position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:0;top:0}
@media (prefers-reduced-motion:reduce){.layer{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="layer on" id="a" alt="Painting">
  <img class="layer" id="b" alt="Painting">
</div>
<button class="nav prev" id="prev" type="button" aria-label="Previous painting">&#8249;</button>
<button class="nav next" id="next" type="button" aria-label="Next painting">&#8250;</button>
<div class="hint" id="hint">Tap the arrows or swipe to browse &nbsp;&middot;&nbsp; tap the painting to pause</div>
<div class="bottom"><div class="count"><b id="cur">1</b> / <span id="tot">1</span></div><div class="state" id="state">Paused</div></div>
<div class="progress" id="bar"></div>
<video class="nosleep" id="nosleep" muted loop playsinline aria-hidden="true" tabindex="-1"

<script>
(function () {
  'use strict';
  var FILES = ["2362", "2331", "2338", "2330", "2342", "2349", "2335", "2333", "2360", "2354", "2341", "2347", "2358", "2361", "2339", "2344", "2332", "2366", "2352", "2348", "2340", "2355", "2363", "2336", "2345", "2350", "2351", "2343", "2346", "2353", "2334", "2337", "2367"];
  var DIR = 'full-';
  var DWELL = 6000, RESUME_AFTER = 30000;
  var N = FILES.length;
  var A = document.getElementById('a'), B = document.getElementById('b');
  var cur = document.getElementById('cur'), bar = document.getElementById('bar');
  var stateEl = document.getElementById('state'), hint = document.getElementById('hint');
  var startEl = document.getElementById('start'), nosleep = document.getElementById('nosleep');
  document.getElementById('tot').textContent = N;
  var idx = 0, front = A, back = B, timer = null, paused = false, resumeT = null, token = 0, started = false, wl = null;

  function src(i) { return DIR + FILES[(i + N) % N] + '.jpg'; }
  function restartBar() {
    bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
    if (!paused && started) { bar.style.transition = 'width ' + DWELL + 'ms linear'; bar.style.width = '100%'; }
  }
  function schedule() {
    clearTimeout(timer);
    if (!paused && started) timer = setTimeout(function () { show(idx + 1); }, DWELL);
    restartBar();
  }
  function show(i) {
    var my = ++token;
    idx = (i + N) % N;
    back.src = src(idx);
    var done = function () {
      if (my !== token) return;
      back.classList.add('on'); front.classList.remove('on');
      var t = front; front = back; back = t;
      cur.textContent = idx + 1;
      var pre = new Image(); pre.src = src(idx + 1);
      schedule();
    };
    if (back.decode) { back.decode().then(done, done); } else { back.onload = done; }
  }
  function setPaused(p) {
    paused = p; clearTimeout(resumeT);
    stateEl.classList.toggle('show', p);
    if (p) resumeT = setTimeout(function () { setPaused(false); }, RESUME_AFTER);
    schedule();
  }
  function go(d) { hint.classList.add('gone'); show(idx + d); }

  document.getElementById('next').addEventListener('click', function (e) { e.stopPropagation(); go(1); });
  document.getElementById('prev').addEventListener('click', function (e) { e.stopPropagation(); go(-1); });
  var stage = document.getElementById('stage'), sx = 0, sy = 0, st = 0;
  stage.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; st = Date.now(); });
  stage.addEventListener('pointerup', function (e) {
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && Date.now() - st < 500) { hint.classList.add('gone'); setPaused(!paused); }
  });
  document.addEventListener('keydown', function (e) {
    if (!started) return;
    if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  });

  /* keep the screen awake: Wake Lock where available, plus a tiny hidden looping video as a fallback */
  function keepAwake() {
    try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (l) { wl = l; }, function () {}); } catch (e) {}
    try { var p = nosleep.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && started) keepAwake(); });

  function begin() {
    if (started) return;
    started = true;
    startEl.classList.add('gone');
    keepAwake();
    try { var d = document.documentElement; var rf = d.requestFullscreen || d.webkitRequestFullscreen; if (rf) { var r = rf.call(d); if (r && r.catch) r.catch(function () {}); } } catch (e) {}
    setTimeout(function () { hint.classList.add('gone'); }, 9000);
    schedule();
  }
  startEl.addEventListener('click', begin);
  startEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } });

  A.src = src(0);
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body>
